<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OS Simulator</title>

<style>
body {
  background: #101827;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 20px;
}

.container {
  max-width: 500px;
  margin: auto;
  background: #1e293b;
  padding: 25px;
  border-radius: 15px;
}

h1 { color: #38bdf8; }

button, select {
  padding: 13px;
  margin: 8px;
  border: none;
  border-radius: 8px;
  background: #0284c7;
  color: white;
  font-size: 16px;
}

#resultado {
  background: #0f172a;
  padding: 20px;
  margin-top: 20px;
  border-radius: 10px;
  min-height: 80px;
}
</style>
</head>

<body>
<div class="container">

<h1>OS SIMULATOR</h1>
<p>Simulador de instalação de sistemas operacionais</p>

<h3>Escolha seu sistema:</h3>

<select id="sistema">
<option value="Windows">Windows</option>
<option value="Linux">Linux</option>
</select>

<div id="resultado">
Bem-vindo ao simulador!
</div>

<button onclick="iniciar()">Iniciar instalação</button>
<button onclick="proximo()">Próxima etapa</button>

</div>

<script>
let etapa = 0;

const etapas = [
"1. Preparação do computador",
"2. Escolha do idioma e teclado",
"3. Configuração da BIOS/UEFI",
"4. Seleção do disco fictício",
"5. Simulação da instalação",
"6. Configuração inicial do sistema",
"7. Instalação concluída!"
];

function iniciar() {
  etapa = 0;
  document.getElementById("resultado").innerHTML =
  "Sistema escolhido: " +
  document.getElementById("sistema").value +
  "<br><br>" + etapas[etapa];
}

function proximo() {
  if (etapa < etapas.length - 1) {
    etapa++;
    document.getElementById("resultado").innerHTML =
    etapas[etapa];
  } else {
    document.getElementById("resultado").innerHTML =
    "Parabéns! Simulação concluída com sucesso!";
  }
}
</script>
  <style>
.desktop-sim {
  background: linear-gradient(135deg,#071b50,#087bd5,#42c9e8);
  min-height:550px;
  padding:20px;
  color:white;
  font-family:Arial;
  border-radius:15px;
}
.desktop-sim h2 {text-align:center}
.desktop-icons {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  margin-top:35px;
}
.desktop-icon {
  background:#ffffff25;
  border:1px solid #ffffff50;
  padding:20px 5px;
  border-radius:12px;
  text-align:center;
  cursor:pointer;
  color:white;
}
.desktop-icon span {
  display:block;
  font-size:38px;
  margin-bottom:8px;
}
.desktop-bar {
  margin-top:40px;
  background:#06152ddd;
  padding:15px;
  border-radius:12px;
  display:flex;
  justify-content:space-between;
}
.desktop-sim button {
  background:#078be8;
  border:0;
  color:white;
  padding:10px 15px;
  border-radius:8px;
}
</style>

<div class="desktop-sim">
  <h2 id="systemTitle">Windows Simulator</h2>
  <p style="text-align:center">Área de trabalho</p>

  <div class="desktop-icons">
    <button class="desktop-icon" onclick="openSim('Meu Computador')">
      <span>💻</span>Meu Computador
    </button>
    <button class="desktop-icon" onclick="openSim('Documentos')">
      <span>📁</span>Documentos
    </button>
    <button class="desktop-icon" onclick="openSim('Navegador')">
      <span>🌐</span>Navegador
    </button>
    <button class="desktop-icon" onclick="openSim('Configurações')">
      <span>⚙️</span>Configurações
    </button>
  </div>

  <div id="simWindow" style="display:none;background:white;color:#172033;padding:20px;border-radius:12px;margin-top:20px">
    <h3 id="windowTitle"></h3>
    <p id="windowText"></p>
    <button onclick="closeSim()">Fechar</button>
  </div>

  <div class="desktop-bar">
    <button onclick="openSim('Menu Iniciar')">⊞ Iniciar</button>
    <span id="simClock"></span>
  </div>
</div>

<script>
function openSim(name) {
  document.getElementById('windowTitle').textContent=name;
  document.getElementById('windowText').textContent=
    'Você abriu a opção '+name+' no OS Simulator!';
  document.getElementById('simWindow').style.display='block';
}
function closeSim() {
  document.getElementById('simWindow').style.display='none';
}
function updateSimClock() {
  document.getElementById('simClock').textContent=
    new Date().toLocaleTimeString('pt-BR');
}
updateSimClock();
setInterval(updateSimClock,1000);
</script>
</body>
